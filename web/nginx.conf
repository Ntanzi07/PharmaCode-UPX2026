server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/drugs -> http://api:8080/drugs  (the trailing slash in proxy_pass strips the /api prefix)
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: any unknown route falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
