    type: object
  User:
    properties:
      email:
        example: ana@farmacia.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Ana Souza
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        example: reviewer
    type: object
  changePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
