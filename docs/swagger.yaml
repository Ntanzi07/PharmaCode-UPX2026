        enum:
        - editor
        - reviewer
        - admin
        example: reviewer
    type: object
  idResponse:
    properties:
      id:
        example: 1
        type: integer
    type: object
  listResponse:
    properties:
      data: {}
      limit:
        type: integer
      offset:
        type: integer
    type: object
  loginRequest:
    properties:
      email:
        example: ana@farmacia.com
        type: string
      password:
        example: uma-senha-forte
        type: string
    type: object
  setPasswordRequest:
    properties:
      password:
        example: nova-senha-forte
        type: string
    type: object
  updatePackageRequest:
    properties:
      description:
        example: 400 mg, caixa com 20 cápsulas
        type: string
      drug_id:
        example: 1
        type: integer
      eans:
        example:
        - "7891058001155"
        - "7891058017392"
        items:
          type: string
        type: array
      presentation_registration:
        example: "1234567890014"
        type: string
    type: object
  updateSummaryRequest:
    properties:
      adverse_effects:
        type: string
      contraindications:
        type: string
      drug_interactions:
        type: string
      leaflet_expedient:
        description: Versão da bula oficial que foi resumida
        example: 0123456/24-5
        type: string
      leaflet_published_at:
        example: "2024-05-31"
        format: date
        type: string
      mechanism_of_action:
        type: string
      missed_dose:
        type: string
      posology:
        type: string
      side_effects:
        type: string
      source_url:
        type: string
      storage:
        type: string
      warnings:
        type: string
      what_is_it_for:
        type: string
