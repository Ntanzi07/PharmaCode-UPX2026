    type: object
  updateUserRequest:
    properties:
      active:
        example: true
        type: boolean
      email:
        example: ana@farmacia.com
        type: string
      name:
        example: Ana Souza
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        enum:
        - editor
        - reviewer
        - admin
        example: reviewer
    type: object
info:
  contact: {}
  description: |-
    API que lê o código da caixa do remédio e retorna a bula simplificada.
    Rota pública: GET /drugs/ean/{ean}. As demais exigem login (POST /auth/login grava um cookie de sessão).
  title: PharmaCode API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Confere email e senha e grava o cookie de sessão (HttpOnly). No
        Swagger, depois do login as outras rotas passam a funcionar neste mesmo navegador.
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/User'
        "400":
          description: invalid json
          schema:
            type: string
        "401":
          description: invalid email or password
          schema:
            type: string
        "429":
          description: too many attempts
          schema:
            type: string
      summary: Entra no painel
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Sai do painel
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/User'
        "401":
          description: authentication required
          schema:
            type: string
      summary: Usuário logado
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Exige a senha atual. As outras sessões do usuário são encerradas;
        a atual continua.
      parameters:
      - description: Senha atual e nova (8 a 72 caracteres)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/changePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: senha nova fraca / json inválido
          schema:
            type: string
        "401":
          description: authentication required
          schema:
            type: string
        "403":
          description: current password is wrong
          schema:
            type: string
      summary: Troca a própria senha
      tags:
      - auth
  /drugs:
    get:
      parameters:
      - description: Itens por página (padrão 20, máx 100)
        in: query
        name: limit
        type: integer
      - description: Quantos itens pular (padrão 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/listResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ListDrugsRow'
                  type: array
              type: object
        "400":
          description: invalid limit / invalid offset
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Lista remédios (paginado)
      tags:
      - drugs
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do remédio
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createDrugRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/idResponse'
        "400":
          description: json inválido ou campo obrigatório faltando
          schema:
            type: string
        "409":
          description: registration_number already exists
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Cadastra um remédio
      tags:
      - drugs
  /drugs/{id}:
    delete:
      parameters:
      - description: ID do remédio
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: drug not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove um remédio
      tags:
      - drugs
    put:
      consumes:
      - application/json
      parameters:
      - description: ID do remédio
        in: path
        name: id
        required: true
        type: integer
      - description: Dados do remédio
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createDrugRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: id ou json inválido
          schema:
            type: string
        "404":
          description: drug not found
          schema:
            type: string
        "409":
          description: registration_number already exists
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Atualiza um remédio
      tags:
      - drugs
  /drugs/ean/{ean}:
    get:
      description: Retorna os dados do remédio e o resumo da bula a partir do código
        de barras da caixa
      parameters:
      - description: Código EAN da embalagem
        in: path
        name: ean
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetSummaryByEANRow'
        "400":
          description: ean is required
          schema:
            type: string
        "404":
          description: ean not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Busca a bula simplificada pelo EAN
      tags:
      - drugs
  /packages:
    get:
      parameters:
      - description: Itens por página (padrão 20, máx 100)
        in: query
        name: limit
        type: integer
      - description: Quantos itens pular (padrão 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/listResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ListPackagesRow'
                  type: array
              type: object
        "400":
          description: invalid limit / invalid offset
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Lista embalagens (paginado)
      tags:
      - packages
    post:
      consumes:
      - application/json
      description: 'Uma embalagem pode ter vários EANs (ex.: código antigo e novo
        convivendo na prateleira).'
      parameters:
      - description: Dados da embalagem
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createPackageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/idResponse'
        "400":
          description: json inválido ou campo obrigatório faltando
          schema:
            type: string
        "404":
          description: drug not found
          schema:
            type: string
        "409":
          description: ean ou presentation_registration já cadastrado
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Cadastra uma embalagem (apresentação) de um remédio
      tags:
      - packages
  /packages/{id}:
    delete:
      parameters:
      - description: ID da embalagem
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: package not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove uma embalagem
      tags:
      - packages
    get:
      parameters:
      - description: ID da embalagem
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetPackageByIdRow'
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: package not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Busca uma embalagem pelo ID
      tags:
      - packages
    put:
      consumes:
      - application/json
      parameters:
      - description: ID da embalagem
        in: path
        name: id
        required: true
        type: integer
      - description: Dados da embalagem
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/updatePackageRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: id ou json inválido
          schema:
            type: string
        "404":
          description: package not found / drug not found
          schema:
            type: string
        "409":
          description: ean ou presentation_registration já cadastrado
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Atualiza uma embalagem
      tags:
      - packages
  /summaries:
    get:
      parameters:
      - description: Itens por página (padrão 20, máx 100)
        in: query
        name: limit
        type: integer
      - description: Quantos itens pular (padrão 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/listResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ListSummariesRow'
                  type: array
              type: object
        "400":
          description: invalid limit / invalid offset
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Lista bulas simplificadas (paginado)
      tags:
      - summaries
    post:
      consumes:
      - application/json
      parameters:
      - description: Resumo da bula
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createSummaryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/idResponse'
        "400":
          description: json inválido ou campo obrigatório faltando
          schema:
            type: string
        "404":
          description: drug not found for this drug_id
          schema:
            type: string
        "409":
          description: this drug already has a summary
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Cadastra a bula simplificada de um remédio
      tags:
      - summaries
  /summaries/{id}:
    delete:
      parameters:
      - description: ID do resumo
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: summary not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Remove uma bula simplificada
      tags:
      - summaries
    get:
      parameters:
      - description: ID do resumo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetSummaryByIDRow'
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: summary not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Busca uma bula simplificada pelo ID
      tags:
      - summaries
    put:
      consumes:
      - application/json
      parameters:
      - description: ID do resumo
        in: path
        name: id
        required: true
        type: integer
      - description: Resumo da bula
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/updateSummaryRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: id ou json inválido / campo obrigatório faltando
          schema:
            type: string
        "404":
          description: summary not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Atualiza uma bula simplificada
      tags:
      - summaries
  /summaries/{id}/review:
    patch:
      description: Quem revisou é o usuário logado (papel reviewer ou admin). Não
        recebe corpo.
      parameters:
      - description: ID do resumo
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "401":
          description: authentication required
          schema:
            type: string
        "403":
          description: insufficient permissions
          schema:
            type: string
        "404":
          description: summary not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Marca uma bula simplificada como revisada
      tags:
      - summaries
  /summaries/drug/{drugID}:
    get:
      parameters:
      - description: ID do remédio
        in: path
        name: drugID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetSummaryByDrugIDRow'
        "400":
          description: invalid drug id
          schema:
            type: string
        "404":
          description: summary not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Busca a bula simplificada de um remédio
      tags:
      - summaries
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ListUsersRow'
            type: array
        "401":
          description: authentication required
          schema:
            type: string
        "403":
          description: insufficient permissions
          schema:
            type: string
      summary: Lista usuários do painel (admin)
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do usuário (senha de 8 a 72 caracteres)
        in: body
        name: body
        required: true
        schema:
