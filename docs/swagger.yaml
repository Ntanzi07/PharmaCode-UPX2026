          type: string
        type: array
      presentation_registration:
        example: "1234567890014"
        type: string
      registration_number:
        example: "1234567890123"
        type: string
    type: object
  createSummaryRequest:
    properties:
      adverse_effects:
        type: string
      contraindications:
        type: string
      drug_id:
        type: integer
      drug_interactions:
        type: string
      leaflet_expedient:
        description: Version of the official leaflet that was summarized
        example: 0123456/24-5
        type: string
      leaflet_published_at:
        example: "2024-05-31"
        format: date
        type: string
      mechanism_of_action:
        type: string
      missed_dose:
        type: string
      posology:
        type: string
      side_effects:
        type: string
      source_url:
        type: string
      storage:
        type: string
      warnings:
        type: string
      what_is_it_for:
        type: string
      when_to_seek_help:
        type: string
    type: object
  createUserRequest:
    properties:
      email:
        example: ana@farmacia.com
        type: string
      name:
        example: Ana Souza
        type: string
      password:
        example: uma-senha-forte
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        enum:
        - editor
        - reviewer
        - admin
        example: reviewer
    type: object
  idResponse:
    properties:
      id:
        example: 1
        type: integer
    type: object
  listResponse:
    properties:
      data: {}
      limit:
        type: integer
      offset:
        type: integer
    type: object
  loginRequest:
    properties:
      email:
        example: ana@farmacia.com
        type: string
      password:
        example: uma-senha-forte
        type: string
    type: object
  setPasswordRequest:
    properties:
      password:
        example: nova-senha-forte
        type: string
    type: object
  updatePackageRequest:
    properties:
      description:
        example: 400 mg, caixa com 20 cápsulas
        type: string
      drug_id:
        example: 1
        type: integer
      eans:
        example:
        - "7891058001155"
        - "7891058017392"
        items:
          type: string
        type: array
      presentation_registration:
        example: "1234567890014"
        type: string
    type: object
  updateSummaryRequest:
    properties:
      adverse_effects:
        type: string
      contraindications:
        type: string
      drug_interactions:
        type: string
      leaflet_expedient:
        description: Version of the official leaflet that was summarized
        example: 0123456/24-5
        type: string
      leaflet_published_at:
        example: "2024-05-31"
        format: date
        type: string
      mechanism_of_action:
        type: string
      missed_dose:
        type: string
      posology:
        type: string
      side_effects:
        type: string
      source_url:
        type: string
      storage:
        type: string
      warnings:
        type: string
      what_is_it_for:
        type: string
      when_to_seek_help:
        type: string
    type: object
  updateUserRequest:
    properties:
      active:
        example: true
        type: boolean
      email:
        example: ana@farmacia.com
        type: string
      name:
        example: Ana Souza
        type: string
      role:
        allOf:
        - $ref: '#/definitions/Role'
        enum:
        - editor
        - reviewer
        - admin
        example: reviewer
    type: object
info:
  contact: {}
  description: |-
    API that reads the barcode on a medicine box and returns the simplified leaflet.
    Public route: GET /drugs/ean/{ean}. All others require login (POST /auth/login sets a session cookie).
  title: PharmaCode API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Checks email and password and sets the session cookie (HttpOnly).
        In Swagger, after logging in the other routes work in this same browser.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/User'
        "400":
          description: invalid json
          schema:
            type: string
        "401":
          description: invalid email or password
          schema:
            type: string
        "429":
          description: too many attempts
          schema:
            type: string
      summary: Log in to the admin panel
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Log out of the admin panel
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/User'
        "401":
          description: authentication required
          schema:
            type: string
      summary: Current user
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Requires the current password. The user's other sessions are ended;
        the current one stays.
      parameters:
      - description: Current and new password (8 to 72 characters)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/changePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: weak new password / invalid json
          schema:
            type: string
        "401":
          description: authentication required
          schema:
            type: string
        "403":
          description: current password is wrong
          schema:
            type: string
      summary: Change your own password
      tags:
      - auth
  /drugs:
    get:
      parameters:
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: How many items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/listResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ListDrugsRow'
                  type: array
              type: object
        "400":
          description: invalid limit / invalid offset
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: List drugs (paginated)
      tags:
      - drugs
    post:
      consumes:
      - application/json
      parameters:
      - description: Drug data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createDrugRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/idResponse'
        "400":
          description: invalid json or missing required field
          schema:
            type: string
        "409":
          description: registration_number already exists
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Create a drug
      tags:
      - drugs
  /drugs/{id}:
    delete:
      parameters:
      - description: Drug ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: drug not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete a drug
      tags:
      - drugs
    put:
      consumes:
      - application/json
      parameters:
      - description: Drug ID
        in: path
        name: id
        required: true
        type: integer
      - description: Drug data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createDrugRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id or json
          schema:
            type: string
        "404":
          description: drug not found
          schema:
            type: string
        "409":
          description: registration_number already exists
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update a drug
      tags:
      - drugs
  /drugs/ean/{ean}:
    get:
      description: Returns the drug data and the leaflet summary from the barcode
        on the box
      parameters:
      - description: Package EAN barcode
        in: path
        name: ean
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetSummaryByEANRow'
        "400":
          description: ean is required
          schema:
            type: string
        "404":
          description: ean not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get the simplified leaflet by EAN
      tags:
      - drugs
  /imports/apply:
    post:
      consumes:
      - multipart/form-data
      description: Same checks as the preview, and then saves everything in one transaction.
        Rows are matched by registration number, presentation registration and EAN,
        so importing the same file again updates instead of duplicating. Imported
        leaflets come in as not reviewed.
      parameters:
      - description: Spreadsheet filled in from the template (.xlsx)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImportResult'
        "400":
          description: file missing, too big or not a valid spreadsheet
          schema:
            type: string
        "401":
          description: authentication required
          schema:
            type: string
        "422":
          description: the spreadsheet has errors; nothing was saved
          schema:
            $ref: '#/definitions/ImportResult'
      summary: Import a spreadsheet
      tags:
      - imports
  /imports/preview:
    post:
      consumes:
      - multipart/form-data
      description: Reads the file, validates every row and runs the import inside
        a transaction that is rolled back. The counts are real; the database is untouched.
      parameters:
      - description: Spreadsheet filled in from the template (.xlsx)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImportResult'
        "400":
          description: file missing, too big or not a valid spreadsheet
          schema:
            type: string
        "401":
          description: authentication required
          schema:
            type: string
      summary: Check a spreadsheet without saving anything
      tags:
      - imports
  /imports/template:
    get:
      description: .xlsx with the "remedios" and "embalagens" sheets, an example row
        and a sheet explaining every column.
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: authentication required
          schema:
            type: string
      summary: Download the spreadsheet template
      tags:
      - imports
  /packages:
    get:
      parameters:
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: How many items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/listResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ListPackagesRow'
                  type: array
              type: object
        "400":
          description: invalid limit / invalid offset
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: List packages (paginated)
      tags:
      - packages
    post:
      consumes:
      - application/json
      description: A package can have several EANs (e.g. an old and a new code on
        the shelf at the same time).
      parameters:
      - description: Package data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createPackageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/idResponse'
        "400":
          description: invalid json or missing required field
          schema:
            type: string
        "404":
          description: drug not found
          schema:
            type: string
        "409":
          description: ean or presentation_registration already registered
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Create a package (presentation) of a drug
      tags:
      - packages
  /packages/{id}:
    delete:
      parameters:
      - description: Package ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: package not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete a package
      tags:
      - packages
    get:
      parameters:
      - description: Package ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetPackageByIdRow'
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: package not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get a package by ID
      tags:
      - packages
    put:
      consumes:
      - application/json
      parameters:
      - description: Package ID
        in: path
        name: id
        required: true
        type: integer
      - description: Package data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/updatePackageRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id or json
          schema:
            type: string
        "404":
          description: package not found / drug not found
          schema:
            type: string
        "409":
          description: ean or presentation_registration already registered
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update a package
      tags:
      - packages
  /summaries:
    get:
      parameters:
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: How many items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/listResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ListSummariesRow'
                  type: array
              type: object
        "400":
          description: invalid limit / invalid offset
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: List simplified leaflets (paginated)
      tags:
      - summaries
    post:
      consumes:
      - application/json
      parameters:
      - description: Leaflet summary
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createSummaryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/idResponse'
        "400":
          description: invalid json or missing required field
          schema:
            type: string
        "404":
          description: drug not found for this drug_id
          schema:
            type: string
        "409":
          description: this drug already has a summary
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Create the simplified leaflet of a drug
      tags:
      - summaries
  /summaries/{id}:
    delete:
      parameters:
      - description: Summary ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: summary not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete a simplified leaflet
      tags:
      - summaries
    get:
      parameters:
      - description: Summary ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetSummaryByIDRow'
        "400":
          description: invalid id
          schema:
            type: string
        "404":
          description: summary not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get a simplified leaflet by ID
      tags:
      - summaries
    put:
      consumes:
      - application/json
      parameters:
      - description: Summary ID
        in: path
        name: id
        required: true
        type: integer
      - description: Leaflet summary
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/updateSummaryRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id or json / missing required field
          schema:
            type: string
        "404":
          description: summary not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
