services:
  db:
    image: postgres:16-alpine
    container_name: bula_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: bula_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
      - "up"
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bula_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Inside the compose network the database host is "db", not localhost,
      # and the port is always 5432 (5433 only exists on your machine).
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      PORT: ${PORT:-8080}
      # Admin panel login
      SESSION_TTL: ${SESSION_TTL:-12h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # First admin: only created if the database has no users yet
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:${PORT:-8080}"

  web:
    build:
      context: ./web
    container_name: bula_web
    restart: unless-stopped
    depends_on:
      - api
    # the container's nginx forwards /api/* to http://api:8080
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
